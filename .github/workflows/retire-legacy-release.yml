name: Retire superseded Windows release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded 1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Soiltary/Velora
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.2.1 --json tagName
          if gh release view v1.1.1 --json tagName >/dev/null 2>&1; then
            gh release delete v1.1.1 --yes --cleanup-tag
          fi
          gh release view v1.2.1 --json tagName,assets
